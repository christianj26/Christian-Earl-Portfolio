<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Monitoring System - Project Details</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../modalstyle.css">
</head>
<body>
    <div class="modal-body">
        <div class="modal-heading">
            <h2 id="modalTitle">Stock Monitoring System</h2>
            <span class="modal-tag">College Project</span>
        </div>
        <p>Provides efficient tracking and management of medical supplies and inventory.</p>

        <div class="modal-carousel">
            <button class="carousel-btn carousel-prev" id="carouselPrev" aria-label="Previous">&#8249;</button>
            <div class="carousel-stage">
                <img id="carouselImage" src="../projects-content-img/SMS/SMSADMIN1.png" alt="Dashboard Page">
                <span class="carousel-label" id="carouselLabel">Dashboard Page</span>
            </div>
            <button class="carousel-btn carousel-next" id="carouselNext" aria-label="Next">&#8250;</button>
        </div>

        <a href="sms-gallery.html" class="screenshots-btn" onclick="sessionStorage.setItem('portfolioScrollPos', window.top.scrollY); window.top.location.href='sms-gallery.html'">View screenshots</a>
    </div>

    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
        <img id="lightboxImage" src="" alt="">
        <span class="carousel-label" id="lightboxLabel"></span>
    </div>

    <script>
        const gallery = [
            { src: "../projects-content-img/SMS/SMSADMIN1.png", label: "Dashboard Page" },
            { src: "../projects-content-img/SMS/SMSADMIN2.png", label: "Medical Records Page" },
            { src: "../projects-content-img/SMS/SMSADMIN3.png", label: "Equipment Usage Page" },
            { src: "../projects-content-img/SMS/SMSADMIN4.png", label: "Medicines Page" },
            { src: "../projects-content-img/SMS/SMSADMIN5.png", label: "Equipment Page (Consumable)" },
            { src: "../projects-content-img/SMS/SMSADMIN6.png", label: "Equipment Page (Non-Consumable)" },
            { src: "../projects-content-img/SMS/SMSADMIN7.png", label: "Patient Info Page" },
            { src: "../projects-content-img/SMS/SMSADMIN8.png", label: "Action Logs Page" },
            { src: "../projects-content-img/SMS/SMSADMIN9.png", label: "Reports Page" }
        ];

        const carouselImage = document.getElementById('carouselImage');
        const carouselLabel = document.getElementById('carouselLabel');
        const carouselPrev = document.getElementById('carouselPrev');
        const carouselNext = document.getElementById('carouselNext');
        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxLabel = document.getElementById('lightboxLabel');
        const lightboxClose = document.getElementById('lightboxClose');

        let currentIndex = 0;

        const showSlide = () => {
            const slide = gallery[currentIndex];
            if (!slide) return;
            carouselImage.src = slide.src;
            carouselImage.alt = slide.label;
            carouselLabel.textContent = slide.label;
        };

        carouselPrev.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + gallery.length) % gallery.length;
            showSlide();
        });

        carouselNext.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % gallery.length;
            showSlide();
        });

        const openLightbox = () => {
            const slide = gallery[currentIndex];
            if (!slide) return;
            lightboxImage.src = slide.src;
            lightboxImage.alt = slide.label;
            lightboxLabel.textContent = slide.label;
            lightboxOverlay.classList.add('open');
        };

        const closeLightbox = () => {
            lightboxOverlay.classList.remove('open');
        };

        carouselImage.addEventListener('click', openLightbox);
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxOverlay.addEventListener('click', (e) => {
            if (e.target === lightboxOverlay) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightboxOverlay.classList.contains('open')) {
                    closeLightbox();
                }
            }
            if (e.key === 'ArrowLeft') {
                carouselPrev.click();
            } else if (e.key === 'ArrowRight') {
                carouselNext.click();
            }
        });
    </script>
</body>
</html>
