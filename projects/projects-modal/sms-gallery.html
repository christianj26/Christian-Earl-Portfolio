<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Monitoring System - Screenshots</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: nourd_bold, sans-serif;
        }

        .gallery-page {
            padding: 100px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .gallery-page h1 {
            font-family: nourd_bold, sans-serif;
            color: #F6F629;
            font-size: 200%;
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gallery-item {
            background-color: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .gallery-item-label {
            padding: 14px 18px;
            font-family: dmsans_regular, sans-serif;
            font-size: 95%;
            color: #F6F629;
            text-align: center;
            background-color: #0a0a0a;
        }

        .floating-back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            width: 50px;
            height: 50px;
            background-color: #F6F629;
            color: #000;
            text-decoration: none;
            border-radius: 50%;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: none;
        }

        .floating-back-btn:hover {
            background-color: #F6F629;
            color: #000;
            border-radius: 50%;
            transform: none;
        }
    </style>
</head>
<body>
    <a href="../../index.html#projects" class="floating-back-btn" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </a>
    <div class="gallery-page">
        <h1>Stock Monitoring System Screenshots</h1>
        <div class="gallery-list">
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN1.png" alt="Dashboard Page">
                <div class="gallery-item-label">Dashboard Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN2.png" alt="Medical Records Page">
                <div class="gallery-item-label">Medical Records Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN3.png" alt="Equipment Usage Page">
                <div class="gallery-item-label">Equipment Usage Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN4.png" alt="Medicines Page">
                <div class="gallery-item-label">Medicines Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN5.png" alt="Equipment Page (Consumable)">
                <div class="gallery-item-label">Equipment Page (Consumable)</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN6.png" alt="Equipment Page (Non-Consumable)">
                <div class="gallery-item-label">Equipment Page (Non-Consumable)</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN7.png" alt="Patient Info Page">
                <div class="gallery-item-label">Patient Info Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN8.png" alt="Action Logs Page">
                <div class="gallery-item-label">Action Logs Page</div>
            </div>
            <div class="gallery-item">
                <img src="../projects-content-img/SMS/SMSADMIN9.png" alt="Reports Page">
                <div class="gallery-item-label">Reports Page</div>
            </div>
        </div>
    </div>
</body>
</html>
